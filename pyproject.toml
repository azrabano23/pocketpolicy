[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pocketpolicy"
version = "0.1.0"
description = "Distil robot foundation policies into int8 C that runs on the microcontroller already inside the arm."
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "loopgraph"]

[project.optional-dependencies]
openpi = ["openpi-client"]
test = ["pytest>=7"]

[project.scripts]
pocketpolicy = "pocketpolicy.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pocketpolicy = ["assets/*.urdf", "assets/NOTICE"]
